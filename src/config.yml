# ============================================================
#  LunarWrath: main configuration
#  Texts use MiniMessage: https://docs.advntr.dev/minimessage/format.html
#  Apply changes with /luna reload
# ============================================================

# Worlds where the moon happens (unless a schedule entry lists its own).
worlds:
  - world

# ------------------------------------------------------------
#  SCHEDULE (2 MODES)
# ------------------------------------------------------------
#
#  MODE 1: "weekly" (default)
#  Fixed times on chosen weekdays in the given timezone.
#  A day can have one or more times. A day without entries has no moon.
#  Example, every Monday at 14:00:
#
#    schedule:
#      mode: weekly
#      days:
#        MONDAY:
#          - "14:00"
#
#  MODE 2: "interval"
#  Every N real hours (72 = every 3 real days).
#  The timer keeps running while the server is offline.
#
#    schedule:
#      mode: interval
#      interval-hours: 72
#
#  Always quote times: "21:30" (24-hour format).
#  In weekly mode a time can be plain text or a block with options:
#        - time: "20:40"
#          difficulty: 3          # x3
#          duration-minutes: 15
#          worlds: [world]        # optional
# ------------------------------------------------------------
schedule:
  enabled: true
  mode: weekly                   # weekly | interval
  timezone: "UTC"
  interval-hours: 72            # interval mode only
  grace-seconds: 180            # if the server was down at the exact time, still start within this margin
  skip-if-no-players: true      # do not start when the world is empty
  warnings-minutes: [10]        # warnings before a scheduled start
  days:
    FRIDAY:
      - time: "21:00"
        difficulty: 1.5
        duration-minutes: 15
    SATURDAY:
      - time: "21:00"
        difficulty: 2.0
        duration-minutes: 15

# ------------------------------------------------------------
#  EVENT
# ------------------------------------------------------------
event:
  duration-minutes: 15
  global: true                 # true: the moon starts in ALL loaded worlds at once
                               #       (hordes, bosses, boss bar, night and participants per world).
                               # false: only in the "worlds" list above.
  lock-night: true              # keep it night during the moon
  night-time-ticks: 18000
  end-time-ticks: 23000         # world time when the moon ends (close to dawn)
  clear-weather: true
  first-wave-delay-seconds: 3   # seconds from the start to the first horde
  remove-mobs-on-end: true
  force-difficulty: true           # raise world difficulty to EASY if it is Peaceful (mobs need it); restored at the end
  protect-terrain: true            # mob explosions (creepers etc.) do not break blocks
  block-wither-spawn: false        # block EVERY Wither except moon bosses; leave false for normal Withers
  ignore-ops: true                 # ignore OP players (mobs do not target them, no hordes on admins, spectator allowed)
  reward-on-stop: false         # reward survivors when stopped with /luna stop
  commands-on-start: []         # console; {world}
  commands-on-end: []
  survivor-commands: []         # console, once per survivor; {player}  e.g. "eco give {player} 500"
  start-announcement:
    # Start title
    title: "<dark_red><bold>BLOOD MOON</bold></dark_red>"
    # Subtitle without parameters (warning.show-parameters: false)
    subtitle: "<red>Survive until dawn...</red>"
    # Subtitle with parameters (warning.show-parameters: true)
    subtitle-with-params: "<red>Survive until dawn <gray>(x{difficulty})</gray></red>"
    # Chat message without parameters
    chat: "<red><bold>🌙 The Blood Moon has risen!</bold> <gray>Survive until dawn...</gray>"
    # Chat message with parameters
    chat-with-params: "<red><bold>🌙 The Blood Moon has risen!</bold> <gray>Difficulty <red>x{difficulty}</red> · Duration <white>{minutes} min</white></gray>"

# Wither control: forbidden in peacetime, allowed during the moon
wither-control:
  enabled: true
  # Allow summoning and spawning the Wither ONLY while a moon is active
  allow-only-during-bloodmoon: true
  # Toggle the WorldGuard deny-spawn flag of the __global__ region automatically
  sync-worldguard: true
  # Worlds this applies to
  worlds:
    - world
  # Other mobs in the __global__ deny-spawn flag that must always stay denied (besides the Wither)
  keep-deny-spawn: []

# ------------------------------------------------------------
#  BLOCK PLACEMENT DURING THE MOON
# ------------------------------------------------------------
block-placement:
  # Allow players to place blocks during the moon
  # true = players can build freely
  # false = placing blocks is denied (no pillaring or walling in)
  allow: true
  # Let creative and spectator players place blocks anyway
  exempt-creative: true
  # Permission that bypasses the ban
  bypass-permission: "bloodmoon.bypass.blockplace"
  # Message when a block is denied (allow: false)
  deny-message: "<red>☠ The Blood Moon's dark magic binds the ground: building is forbidden!</red>"

# ------------------------------------------------------------
#  WARNINGS & COUNTDOWN
# ------------------------------------------------------------
warning:
  # Show moon parameters (difficulty and duration) in warnings.
  # Default false: players do not learn the exact difficulty in advance.
  show-parameters: false
  # Warning sound (entity.wither.ambient, entity.ender_dragon.growl, ambient.cave ...)
  sound: "entity.wither.ambient"
  sound-volume: 1.0
  sound-pitch: 0.6

countdown:
  # Send periodic alerts during the countdown
  # false (default): exactly ONE notice when the command runs, nothing more until the moon rises.
  periodic-alerts: false
  # Show parameters in the countdown (default false)
  show-parameters: false
  # Countdown alert sound
  sound: "entity.ender_dragon.growl"
  sound-volume: 1.0
  sound-pitch: 0.6
  # Seconds at which chat and screen alerts are shown
  alert-seconds: [300, 180, 120, 60, 30, 15, 10, 5, 4, 3, 2, 1]
  # Tick sound for the last 5 seconds
  tick-sound: "block.note_block.basedrum"
  # Chat message (no parameters)
  chat: "<dark_red><bold>☠ WARNING:</bold></dark_red> <red>The Blood Moon rises in <yellow>{time}</yellow>! Prepare for the nightmare!</red>"
  # Chat message (with parameters, show-parameters: true)
  chat-with-params: "<dark_red><bold>☠ WARNING:</bold></dark_red> <red>The Blood Moon rises in <yellow>{time}</yellow>! <gray>(Difficulty <red>x{difficulty}</red> · Duration <white>{duration} min</white>)</gray></red>"
  # Screen title. Keep titles short (about 15 bold characters) so they fit any screen.
  title: "<dark_red><bold>BLOOD MOON</bold></dark_red>"
  subtitle: "<red>Rises in {time}...</red>"
  subtitle-with-params: "<red>Rises in {time} <gray>(x{difficulty})</gray></red>"

# ------------------------------------------------------------
#  SPECTATOR BLOCK
# ------------------------------------------------------------
spectator-block:
  # Forbid spectator mode during the moon and its countdown
  enabled: true
  # Move players out of spectator into survival when the moon or countdown starts
  kick-existing: true
  # Bypass permission (OPs always bypass)
  bypass-permission: ""
  # Message when switching to spectator is denied
  deny-message: "<red><bold>☠ The Blood Moon forbids spectator mode! Fight or perish!</bold></red>"
  # Message when a player is moved out of spectator
  kick-message: "<red><bold>☠ The Blood Moon has risen: spectator mode is off, you are back in survival!</bold></red>"

# ------------------------------------------------------------
#  DIMENSION WRATH (NO HIDING IN THE NETHER OR THE END)
# ------------------------------------------------------------
dimension-wrath:
  # Punish players who try to wait out the moon in other dimensions
  enabled: true
  # Punish in the Nether
  apply-to-nether: true
  # Punish in the End
  apply-to-end: true
  # Seconds between targeted lightning strikes
  strike-interval-seconds: 2
  # Damage per strike (4.0 = 2 hearts)
  damage: 4.0
  # Announce in public chat (false = private message to the offender only)
  broadcast-chat: true
  # Seconds between chat announcements
  broadcast-interval-seconds: 30
  # Exempt creative and spectator players
  exempt-creative: true
  # Bypass permission
  bypass-permission: "bloodmoon.bypass.dimensionwrath"
  # Nether messages
  nether:
    broadcast-message: "<gradient:#ff4500:#990000><bold>⚡ NETHER WRATH:</bold></gradient> <red>There is no escape from the Blood Moon in the Nether! <yellow>{player}</yellow> was struck by hellish lightning for hiding there!</red>"
    actionbar-message: "<gradient:#ff5500:#aa0000><bold>⚡ Nether lightning strikes you for fleeing! (-{hearts} ❤)</bold></gradient>"
    death-message: "<gradient:#ff4500:#990000><bold>☠ <yellow>{player}</yellow> tried to hide from the Blood Moon in the Nether and was burned to ash!</gradient>"
  # End messages
  end:
    broadcast-message: "<gradient:#b000ff:#440077><bold>⚡ END WRATH:</bold></gradient> <red>There is no escape from the Blood Moon in the void! <yellow>{player}</yellow> was struck by astral lightning for hiding in the End!</red>"
    actionbar-message: "<gradient:#c033ff:#660099><bold>⚡ Void lightning strikes you for fleeing to the End! (-{hearts} ❤)</bold></gradient>"
    death-message: "<gradient:#b000ff:#440077><bold>☠ <yellow>{player}</yellow> tried to hide from the Blood Moon in the End and was consumed by astral lightning!</gradient>"

# ------------------------------------------------------------
#  ELYTRA WRATH (NO FLYING HIGH ON ELYTRA)
# ------------------------------------------------------------
elytra-wrath:
  # Knock down and punish players gliding high on elytra
  enabled: true
  # Minimum Y where flying counts as escaping
  min-altitude: 90.0
  # Seconds of continuous flight allowed before the first strike
  flight-time-seconds: 3
  # Seconds between strikes
  strike-interval-seconds: 2
  # Damage of the first strike (4.0 = 2 hearts)
  damage: 4.0
  # Damage multiplier for every following strike in a row (1.5 = +50%: 4, 6, 9, 13.5, 20 ...)
  damage-multiplier: 1.5
  # Damage cap for a single strike
  max-damage: 40.0
  # Seconds without strikes before the streak resets (landing does not reset it)
  streak-reset-seconds: 60
  # Warn in chat once the next strike would deal this much damage (0 = never)
  warn-damage: 8.0
  # Chat warning, {hearts} = damage of the next strike in hearts
  warn-message: "<dark_red><bold>⚠ The sky rejects you!</bold></dark_red> <red>Every strike hits harder than the last: the next one takes <yellow>{hearts} ❤</yellow>. Land now!</red>"
  # Force the elytra closed (stop gliding)
  disrupt-flight: true
  # Announce in public chat (false = private message to the offender only)
  broadcast-chat: true
  # Seconds between chat announcements
  broadcast-interval-seconds: 30
  # Exempt creative and spectator players
  exempt-creative: true
  # Bypass permission
  bypass-permission: "bloodmoon.bypass.elytrawrath"
  # Public chat message
  broadcast-message: "<gradient:#00e5ff:#0055ff><bold>⚡ WRATH OF THE SKY:</bold></gradient> <red>There is no escape from the Blood Moon in the sky! <yellow>{player}</yellow> was struck by lightning for flying on elytra!</red>"
  # Action bar message
  actionbar-message: "<gradient:#00e5ff:#0088ff><bold>⚡ The Blood Moon's lightning knocks you out of the sky! (-{hearts} ❤)</bold></gradient>"
  # Death message
  death-message: "<gradient:#00e5ff:#0055ff><bold>☠ <yellow>{player}</yellow> tried to escape the Blood Moon on elytra and was burned by lightning!</gradient>"

# ------------------------------------------------------------
#  DEATH SUMMARY (NO SPAM FROM REPEATED DEATHS)
# ------------------------------------------------------------
death-summary:
  # A player's first death is announced as usual; further deaths inside the window are hidden and summed up
  enabled: true
  # Window length in seconds, at most one summary per window
  window-seconds: 60
  # Summary line, {player}, {count} = hidden deaths, {seconds} = window length
  message: "<dark_red>☠</dark_red> <white><bold>{player}</bold></white> <red>died <yellow>{count}</yellow> more times in the last minute.</red>"

# ------------------------------------------------------------
#  CONTAINER WRATH (CHESTS ARE SEALED DURING THE MOON)
# ------------------------------------------------------------
container-wrath:
  # Forbid opening storage in a world with an active moon
  enabled: true
  # Sealed blocks (remove the list to use chests, barrels, ender chests and all shulker boxes)
  blocks:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - ENDER_CHEST
    - SHULKER_BOX
    - WHITE_SHULKER_BOX
    - ORANGE_SHULKER_BOX
    - MAGENTA_SHULKER_BOX
    - LIGHT_BLUE_SHULKER_BOX
    - YELLOW_SHULKER_BOX
    - LIME_SHULKER_BOX
    - PINK_SHULKER_BOX
    - GRAY_SHULKER_BOX
    - LIGHT_GRAY_SHULKER_BOX
    - CYAN_SHULKER_BOX
    - PURPLE_SHULKER_BOX
    - BLUE_SHULKER_BOX
    - BROWN_SHULKER_BOX
    - GREEN_SHULKER_BOX
    - RED_SHULKER_BOX
    - BLACK_SHULKER_BOX
  # Also seal chest and hopper minecarts
  block-minecarts: true
  # Attempts that only warn before a boss appears
  warnings-before-punish: 1
  # At most one boss per player per this many seconds
  punish-cooldown-seconds: 180
  # Summon a boss after the warnings
  boss-enabled: true
  # Boss from bosses.yml that bursts out of the container
  boss: "wither_sombra"
  # Seal blast on attempts that do not summon the boss: breaks no blocks, hits only the opener
  explosion:
    enabled: true
    # Damage to the player (6.0 = 3 hearts, armor reduces it)
    damage: 6.0
  # Exempt creative and spectator players
  exempt-creative: true
  # Bypass permission
  bypass-permission: "bloodmoon.bypass.containerwrath"
  # Private warning when someone tries to open a container
  warn-message: "<dark_red><bold>⚠ Do not open chests during the Blood Moon!</bold></dark_red> <red>Storage is sealed and the seal explodes when touched. Try again and you wake what sleeps inside.</red>"
  # Message when a boss bursts out
  punish-message: "<dark_red><bold>☠ You disturbed a sealed container!</bold></dark_red> <red>A guardian of the Blood Moon breaks free.</red>"

# ------------------------------------------------------------
#  DYNAMIC DIFFICULTY (CAMPING RAISES THE DIFFICULTY)
# ------------------------------------------------------------
dynamic-difficulty:
  # Raise the difficulty when players hide instead of fighting
  enabled: true
  # Seconds without combat after which a player counts as camping
  inactivity-seconds: 45
  # Standing-still radius in blocks
  camping-radius: 4.0
  # Seconds between escalations
  escalation-interval-seconds: 25
  # Difficulty added per escalation
  difficulty-step: 0.25
  # Highest difficulty camping can reach (0 = no limit)
  max-difficulty: 0
  # Spawn a punishment horde around the camper
  spawn-punishment-horde: true
  # Mobs in the punishment horde
  punishment-horde-count: 5
  # Lower the difficulty while players actively kill monsters
  decay-on-combat: true
  # Monster kills needed for one decay step
  kills-for-decay: 10
  # Difficulty removed per decay step
  decay-step: 0.1
  # Exempt creative and spectator players
  exempt-creative: true
  # Announce changes in public chat with the player's name (false = private message only)
  broadcast-chat: true
  bypass-permission: "bloodmoon.bypass.dynamicdifficulty"
  announcement:
    escalate: "<gradient:#ff2200:#ff8800><bold>⚡ BLOOD MOON FURY:</bold></gradient> <red><yellow>{player}</yellow> is hiding instead of fighting and the moon grows angry! Difficulty rose to <yellow>x{difficulty}</yellow>!</red>"
    camper-warning: "<gradient:#ff0000:#aa0000><bold>☠ The Blood Moon smells your fear! Stop hiding and fight!</bold></gradient>"
    # {players} = up to three players with the most kills since the last decay, {player} = the last killer
    decay: "<gradient:#00ff88:#00aa55><bold>✔ SURVIVORS' WILL:</bold></gradient> <green><yellow>{players}</yellow> are slaying the moon's spawn and its fury fades! Difficulty dropped to <yellow>x{difficulty}</yellow>.</green>"

# ------------------------------------------------------------
#  WARNING TYPES (/luna warn)
# ------------------------------------------------------------
warning-types:
  # 1. Normal moon (/luna warn 10m normal)
  normal:
    default-difficulty: 1.0
    chat: "<gradient:#ff4500:#b30000><bold>🌙 OMEN OF THE BLOOD MOON:</bold></gradient> <red>The horizon turns crimson... The Blood Moon rises in <yellow>{time}</yellow>! Ready your weapons and fortify your shelters!</red>"
    title: "<gradient:#ff5555:#aa0000><bold>BLOOD MOON</bold></gradient>"
    subtitle: "<gray>Rises in <yellow>{time}</yellow></gray>"
    sound: "ambient.cave"
    volume: 1.0
    pitch: 0.8
  # 2. Dangerous moon (/luna warn 10m dangerous)
  dangerous:
    default-difficulty: 2.5
    chat: "<gradient:#ff0055:#990022><bold>☠ OMINOUS SIGN:</bold></gradient> <red>The air smells of ash and sulfur... A <bold><dark_red>DANGEROUS Blood Moon</dark_red></bold> rises in <yellow>{time}</yellow>! Ancient hordes thirst for blood!</red>"
    title: "<gradient:#ff0033:#770011><bold>DANGEROUS MOON</bold></gradient>"
    subtitle: "<red>In <yellow>{time}</yellow>! Run!</red>"
    sound: "entity.ender_dragon.growl"
    volume: 1.0
    pitch: 0.9
  # 3. Lethal moon (/luna warn 10m lethal)
  lethal:
    default-difficulty: 5.0
    chat: "<gradient:#880000:#ff0000><bold>⚡ DEADLY DOOM:</bold></gradient> <red><bold>The ground shakes and the sky weeps blood...</bold> In <yellow>{time}</yellow> a <gradient:#ff0000:#330000><bold>LETHAL Blood Moon</bold></gradient> rises! Almost no one survives. There will be no mercy!</red>"
    title: "<gradient:#330000:#ff0000><bold>MOON OF DEATH</bold></gradient>"
    subtitle: "<dark_red>In {time}. No one leaves alive</dark_red>"
    sound: "entity.wither.spawn"
    volume: 1.0
    pitch: 0.6

# ------------------------------------------------------------
#  MOON TYPES (BLACK MOON & PURPLE MOON)
# ------------------------------------------------------------
moon-types:
  black:
    display-name: "Black Moon"
    bar-color: PURPLE
    health-multiplier: 1.5
    damage-multiplier: 1.5
    speed-multiplier: 1.15
    horde-size-multiplier: 1.5
    announcement:
      chat: "<gradient:#222222:#880088><bold>🌑 ECLIPSE OF THE BLACK MOON:</bold></gradient> <dark_gray><bold>Darkness swallowed the sky...</bold></dark_gray> <red>The BLACK MOON has risen! Its spawn are 50% stronger and more numerous!</red>"
      title: "<gradient:#111111:#660066><bold>BLACK MOON</bold></gradient>"
      subtitle: "<gray>Darkness covers the world. Fight!</gray>"
      sound: "entity.wither.spawn"
      volume: 1.0
      pitch: 0.5
  purple:
    display-name: "Purple Moon"
    bar-color: PURPLE
    health-multiplier: 1.3
    damage-multiplier: 1.3
    speed-multiplier: 1.25
    horde-size-multiplier: 1.25
    announcement:
      chat: "<gradient:#9900ff:#e000ff><bold>🔮 VOID RIFT:</bold></gradient> <light_purple>The sky splits with a violet glow... The PURPLE MOON has risen! Astral creatures have entered this world!</light_purple>"
      title: "<gradient:#8800ff:#ff00ff><bold>PURPLE MOON</bold></gradient>"
      subtitle: "<light_purple>The void rift is open!</light_purple>"
      sound: "entity.ender_dragon.growl"
      volume: 1.0
      pitch: 1.1

# ------------------------------------------------------------
#  CHAT ANNOUNCEMENTS
#  Turn categories on or off. Apply with /luna reload
# ------------------------------------------------------------
announce:
  horde: false                # "a horde attacks <player>" (false: private action bar and roar for the target, no chat spam)
  bosses: true                # boss spawns, deaths and top damage
  loot: true                  # epic, legendary and mythic drops
  mob-kills: false            # kills of regular moon mobs (1 in 5)
  player-deaths: true         # player deaths during the moon, with thunder
  event: true                 # start, end and results of the moon
  specials: false             # eclipse, storm, fog, silence
  survivors: true             # survivor results
  warnings: true              # warnings before a scheduled start

# ------------------------------------------------------------
#  QUIT PENALTY
#  Players who leave the server during the danger window
#  after the moon starts die where they logged out.
# ------------------------------------------------------------
quit-penalty:
  enabled: true
  # Danger window in seconds after the start (60 = 1 minute).
  # 0 or -1 = the penalty lasts the WHOLE moon.
  duration-seconds: 60
  # Do not punish creative and spectator players
  exempt-creative: true
  # Bypass permission
  bypass-permission: "bloodmoon.bypass.quitpenalty"
  # Announcements at the start of the moon
  announcement:
    # Public chat message
    chat: "<gradient:#ff0000:#880000><bold>☠ The Blood Moon evolves:</bold></gradient> <red><bold>leave the server after the moon rises and you die!</bold></red>"
    # Delay before the screen title (seconds, so it does not cover the moon intro)
    title-delay-seconds: 3
    # Screen title
    title: "<dark_red><bold>DON'T LEAVE!</bold></dark_red>"
    # Screen subtitle
    subtitle: "<red>Leaving now means death</red>"
    # Title animation in ticks (20 ticks = 1 second)
    title-times:
      fade-in: 10
      stay: 120
      fade-out: 20
    # Sound at the start
    sound: "entity.ender_dragon.growl"
    # Chat warning for players joining during the danger window
    join-warning: "<gradient:#ff0000:#770000><bold>☠ WARNING:</bold></gradient> <red>A Blood Moon is active! Leaving within {remaining}s means instant death!</red>"
    # Screen title on join
    join-title: "<dark_red><bold>MOON IS ACTIVE</bold></dark_red>"
    join-subtitle: "<red>Don't leave for {remaining}s</red>"
  # What happens on quit
  on-quit:
    # Kill the player
    kill: true
    # Drop the inventory (follows server rules)
    drop-items: true
    # Drop everything even with keepInventory on
    force-drop-items: false
    # Lightning and particles where the player left
    lightning: true
    # Announce the coward's death in chat
    broadcast: true
    death-message: "<gradient:#ff2222:#880000><bold>☠ <yellow>{player}</yellow> tried to flee the Blood Moon, but death caught up!</gradient>"
    # Message on the next join
    reconnect-message: "<dark_red><bold>☠ You were executed for fleeing the Blood Moon!</bold></dark_red>"

# ------------------------------------------------------------
#  DIFFICULTY
#  Multiplier N (x1 base, x100, x1000 ...). For each stat:
#      value = base * (1 + (N - 1) * factor)
# ------------------------------------------------------------
difficulty:
  default: 1.0
  max: 1000.0             # highest difficulty you can set (up to x1000)
  speed-cap: 1.35         # hard cap on mob speed (+35%, prevents glitching through walls)
  max-health-cap: 2048.0  # mob health cap (2048 HP, Paper's limit)
  max-horde-size-multiplier: 1.5 # horde size cap (prevents lag and entity overload)
  level:
    enabled: true         # show mob levels based on difficulty
    format: "<gray>[<gradient:#ff5555:#ffaa00>Lv. {level}</gradient>] {name}" # mob name format
    always-visible: false # true = name visible through blocks, false = vanilla behaviour
    store-pdc: true       # store the level in PDC (Keys.LEVEL and levelledmobs:level)
  bosses:
    scale-count-max: 1    # exactly 1 boss per spawn (only stats and rewards scale)
  scaling:
    health: 0.35         # mob health (+35% per difficulty level)
    damage: 0.35         # mob damage (+35% per difficulty level)
    speed: 0.05          # speed gain (capped by speed-cap)
    horde-size: 0.15     # horde size gain
    horde-size-max-difficulty: 5.0 # horde size stops growing above x5
    spawn-speed: 0.15    # horde wave frequency gain
    spawn-speed-max-difficulty: 5.0 # wave frequency stops growing above x5
    loot-chance: 0.35    # loot drop chance
    loot-chance-max-difficulty: 5.0 # loot chance stops growing above x5
    rarity-luck: 0.45    # luck for rare loot categories
    rarity-luck-max-difficulty: 5.0 # luck stops growing above x5
  epic-effects:
    enabled: true
    min-difficulty: 3.0   # epic effects from x3
    prevent-mob-infighting: true # horde mobs do not fight each other, they focus players
    rain-min-difficulty: 100.0 # heavy rain and thunder only from x100
    red-sky:
      enabled: true
      red-vignette: true
    lightning:
      enabled: true
      base-strikes-per-sec: 0.46 # frequency at the lowest epic difficulty (x3)
      max-strikes-per-sec: 45.5  # frequency at extreme difficulty (x1000)
      min-radius: 8.0            # minimum distance from the player
      max-radius: 28.0           # maximum radius of the lightning zone
    particles:
      ambient-blood-spores: true
    fireworks:
      enabled: true
      interval-seconds: 12
      launch-at-player-chance: 0.20
    mob-abilities:
      skeleton-levitation:
        enabled: true
        chance: 0.20
        duration-ticks: 40 # 2 seconds of levitation
        amplifier: 0
      zombie-lightning:
        enabled: true
        chance: 0.15
        bonus-damage: 2.5
      spider-slowness:
        enabled: true
        chance: 0.20
        duration-ticks: 60
      creeper-fireworks:
        enabled: true
        rocket-count: 3
  incendium:
    enabled: true
    chance-in-horde: 0.20 # chance of a paratrooper, pyromancer or crossbowman in a wave
    pyromancer:
      min-difficulty: 6.0 # pyromancers appear only from x6
      temp-fire: true     # fire is put out and cleaned up when the moon ends

# ------------------------------------------------------------
#  HORDES
# ------------------------------------------------------------
horde:
  enabled: true
  interval-seconds: 40
  min-interval-seconds: 15
  base-size: 3
  wave-max-size: 10
  max-alive-per-player: 12
  spawn-distance: { min: 16, max: 28 }
  require-armor:
    enabled: false
    min-pieces: 4
    materials: [DIAMOND, NETHERITE]
