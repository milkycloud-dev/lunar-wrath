# ============================================================
#  LunarWrath: per-world settings
#  A copy of this file is created for every world in worlds/<world>/config.yml.
#  Keys you leave out fall back to the global config.yml.
#  Layout matches BloodMoon-Reborn for easy migration.
# ============================================================

# If true, this world is permanently under the moon (it cannot be stopped).
WorldPermanent: false

# Block sleeping during the moon.
BedNotAllowed: true

# If true, dying during the moon wipes the inventory.
DyingLossesInventory: false

# If true, dying during the moon resets experience.
DyingLossesExperience: false

# Commands run when the moon starts.
# Suffixes: ;s = console once, ;f = console for every player, ;p = run by the player
# Placeholders: %player%, %world%, %difficulty%
CommandsOnStart: []

# Commands run when the moon ends.
CommandsOnEnd: []

# ---------------- Survivor rewards ----------------
SurvivorRewards:
  Enabled: false
  RequireOnlineAtEnd: true
  IncludeLateJoiners: true
  MinimumParticipationSeconds: 60
  DisqualifyOnDeath: true
  DisqualifyOnWorldLeave: false
  DisqualifyOnDisconnect: false
  RewardOncePerSession: true
  Messages:
    - "&aYou survived the Blood Moon!"
  Commands:
    - "give %player% minecraft:diamond 1;f"
    - "experience add %player% 100 points;f"

# ---------------- Boss settings ----------------
Boss:
  Mode: VANILLA                    # VANILLA | MYTHICMOBS | NONE
  VanillaBossBar:
    Enabled: true
    Title: "%boss_name% &c%boss_health%&7/&c%boss_max_health%"
    Color: RED
    Style: SEGMENTED_10
    Audience: NEARBY               # NEARBY | WORLD | ALL
    ViewDistance: 64
    ShowHealthNumbers: true
  Rewards:
    Enabled: false
    Mode: KILLER                   # KILLER | TOP_DAMAGE | ALL
    RequirePlayerKiller: true
    RewardOnce: true
    Commands:
      - "give %boss_killer% minecraft:diamond 3;s"
      - "experience add %boss_killer% 250 points;s"
  MythicMobs:
    Enabled: false
    InternalName: BloodMoonBoss
    UseMythicMobsRewards: true
    RunBloodMoonRewardCommands: false
    FallbackToVanilla: true
