# ==================== Луны ====================
moon:
  name:
    blood: "Кровавая Луна"
    black: "Чёрная Луна"
    purple: "Фиолетовая Луна"
  # Замены в предупреждениях для чёрной и фиолетовой луны ("было=>стало|было=>стало")
  rename:
    black: "Кровавая Луна=>Чёрная Луна|Кровавой Луны=>Чёрной Луны|Кровавой Луне=>Чёрной Луне|КРОВАВАЯ=>ЧЁРНАЯ|Кровавая=>Чёрная"
    purple: "Кровавая Луна=>Фиолетовая Луна|Кровавой Луны=>Фиолетовой Луны|Кровавой Луне=>Фиолетовой Луне|КРОВАВАЯ=>ФИОЛЕТОВАЯ|Кровавая=>Фиолетовая"

