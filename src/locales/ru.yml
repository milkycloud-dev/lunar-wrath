  crossbowman: "<gradient:#ff5555:#ffff55>Адский арбалетчик</gradient>"

# ==================== Тексты ====================
text:
  command:
    m001: "<green>✔ Оповещение об эволюции Кровавой Луны отправлено всем игрокам!</green>"
    m002: "<yellow>⚡ Обратный отсчет отменен.</yellow>"
    m003: "<green>✔ Запущен обратный отсчет до {display-name} ({countdown-sec} сек).</green>"
    m004: "<green>✔ Взошла {display-name} ({started-label})!</green>"
    m005: "<yellow>⚡ Обратный отсчет отменен.</yellow>"
    m006: "<green>✔ Запущен обратный отсчет до {display-name} ({final-sec}, сложность: x{difficulty}, тип: {name}).</green>"
    m007: "<gold>Команда предупреждений о Луне:</gold>"
    m008: "<yellow>/luna warn <время> [тип] [вид_луны] [start]</yellow>"
    m009: "<gray>Типы предупреждений: <white>normal</white> (обычная), <white>dangerous</white> (опасная), <white>lethal</white> (смертельная)</gray>"
    m010: "<gray>Виды луны: <red>blood</red> (кровавая), <dark_gray>black</dark_gray> (чёрная), <light_purple>purple</light_purple> (фиолетовая)</gray>"
    m011: "<gray>Примеры:</gray>"
    m012: "<gray>- <yellow>/luna warn 10m</yellow> (обычное оповещение за 10 мин)</gray>"
    m013: "<gray>- <yellow>/luna warn 10m dangerous</yellow> (оповещение об опасной луне)</gray>"
    m014: "<gray>- <yellow>/luna warn 10m lethal black</yellow> (смертельная чёрная луна)</gray>"
    m015: "<gray>- <yellow>/luna warn 10m lethal black start</yellow> (оповестить и начать отсчет!)</gray>"
    m016: "<green>✔ Оповещение отправлено, запущен отсчет до {display-name} ({sec})!</green>"
    m017: "<green>✔ Оповещение отправлено: <yellow>{name} {display-name} ({sec})</yellow>.</green>"
    m018: "<dark_red><bold>⚡ УПРАВЛЕНИЕ МОЛНИЯМИ КРОВАВОЙ ЛУНЫ:</bold></dark_red>"
    m019: "<yellow>/luna lightning storm [игрок|all] [уд/сек] [радиус] [сек]</yellow> <gray>- Периметр молний вокруг игрока</gray>"
    m020: "<yellow>/luna lightning smite <игрок> [интервал_сек] [урон_хп] [сек]</yellow> <gray>- Прицельные удары с уроном</gray>"
    m021: "<yellow>/luna lightning strike <игрок> [урон_хп]</yellow> <gray>- Одиночный удар молнии</gray>"
    m022: "<yellow>/luna lightning frequency <storm|smite> <игрок|all> <значение></yellow> <gray>- Частота идущих молний: storm в ударах/сек, smite интервал в сек</gray>"
    m023: "<yellow>/luna lightning stop [игрок|all]</yellow> <gray>- Остановить эффекты молний</gray>"
    m024: "<yellow>/luna lightning status</yellow> <gray>- Показать активные эффекты</gray>"
    m025: "<gray>Подсказка: 1.0 HP = 0.5 ❤ (полсердечка), 2.0 HP = 1 ❤, 20.0 HP = полное здоровье.</gray>"
    m026: "<red>Модуль молний не инициализирован.</red>"
    m027: "<green>✔ Все штормовые молнии остановлены.</green>"
    m028: "<red>Игрок '{input}' не найден.</red>"
    m029: "<green>✔ Запущен периметр молний вокруг <yellow>{target-name}</yellow> (<white>{rate} уд/сек</white>, радиус <white>{radius}м</white>){dur-str}!</green>"
    m030: "<yellow>Использование: /luna lightning smite <игрок> [интервал_сек] [урон_хп] [длительность_сек]</yellow>"
    m031: "<gray>Пример: /luna lightning smite mike 2 1.0 30 (каждые 2 сек по 0.5 ❤ на 30 сек)</gray>"
    m032: "<green>✔ Прицельные молнии для <yellow>{player}</yellow> остановлены.</green>"
    m033: "<red>Игрок '{input}' не найден.</red>"
    m034: "<green>✔ Запущена прицельная кара молниями по игроку <yellow>{player}</yellow>: каждые <white>{interval}с</white> урон <red>{damage} HP ({hearts} ❤)</red>{dur-str}!</green>"
    m035: "<yellow>Использование: /luna lightning strike <игрок> [урон_хп]</yellow>"
    m036: "<red>Игрок '{input}' не найден.</red>"
    m037: "<green>✔ Прицельная молния ударила в игрока <yellow>{player}</yellow> (урон: <red>{damage} HP</red>)!</green>"
    m038: "<green>✔ Все эффекты молний для игрока <yellow>{player}</yellow> остановлены.</green>"
    m039: "<red>Игрок '{input}' не найден.</red>"
    m040: "<green>✔ Все активные штормы и прицельные молнии остановлены для всех игроков.</green>"
    m041: "<yellow>Использование: /luna lightning frequency <storm|smite> <игрок|all> <значение></yellow>"
    m042: "<gray>storm: ударов в секунду вокруг игрока (от 0.05, потолок в конфиге lightning.max-strikes-per-second). smite: секунд между прицельными ударами (от 0.1).</gray>"
    m043: "<red>Игрок '{input}' не найден.</red>"
    m044: "<red>Значение должно быть числом: {input}</red>"
    m045: "<gray>Для <yellow>{target-name}</yellow> нет активных эффектов {type}.</gray>"
    m046: "<green>✔ Частота шторма для <yellow>{target-name}</yellow>: <white>{value} уд/сек</white> (эффектов: {changed}).</green>"
    m047: "<green>✔ Интервал прицельных молний для <yellow>{target-name}</yellow>: <white>{value} сек</white> (эффектов: {changed}).</green>"
    m048: "<gold>Статус системы молний:</gold>"
    m049: "<gray>- Активных штормов периметра: <yellow>{storm-count}</yellow></gray>"
    m050: "<gray>- Активных прицельных кар (smite): <yellow>{smite-count}</yellow></gray>"
    m051: "<red>Неизвестное действие. Введите /luna lightning help для подсказок.</red>"
    m052: "<dark_red><bold>🌙 Команды Кровавой Луны</bold></dark_red> <gray>(Tab подсказывает аргументы)</gray>"
    m053: "<yellow>/luna</yellow> <gray>- статус текущей луны</gray>"
    m054: "<yellow>/luna next</yellow> <gray>- ближайшие луны по расписанию</gray>"
    m055: "<gold>Запуск и остановка</gold>"
    m056: "<yellow>/luna start [мир] [xN] [время] [blood|black|purple]</yellow> <gray>- запустить луну</gray>"
    m057: "<yellow>/luna blood|black|purple [мир] [время] [xN]</yellow> <gray>- запустить луну нужного вида</gray>"
    m058: "<yellow>/luna stop [мир|all]</yellow> <gray>- остановить луну</gray>"
    m059: "<yellow>/luna warn <время> [normal|dangerous|lethal] [вид] [start]</yellow> <gray>- оповестить о луне</gray>"
    m060: "<yellow>/luna countdown <время> [тип] [вид] [мир]</yellow> <gray>- отсчёт до старта</gray>"
    m061: "<yellow>/luna cancel</yellow> <gray>- отменить отсчёт</gray>"
    m062: "<gold>Ход луны</gold>"
    m063: "<yellow>/luna time <status|add|take|set> [время] [мир|all]</yellow> <gray>- оставшееся время</gray>"
    m064: "<yellow>/luna difficulty <xN> [мир]</yellow> <gray>- задать сложность</gray>"
    m065: "<yellow>/luna dynamic <status|on|off|reset> [мир|all]</yellow> <gray>- рост сложности за отсиживание</gray>"
    m066: "<yellow>/luna boss <id> [мир|игрок]</yellow> <gray>- призвать босса</gray>"
    m067: "<yellow>/luna horde [мир]</yellow> <gray>- волна орды</gray>"
    m068: "<yellow>/luna killmobs [мир]</yellow> <gray>- убрать мобов луны</gray>"
    m069: "<gold>Эффекты</gold>"
    m070: "<yellow>/luna lightning <storm|smite|strike|frequency|stop|status></yellow> <gray>- молнии, подробнее /luna lightning help</gray>"
    m071: "<yellow>/luna sound <звук|random> [all|мир|игрок] [громкость]</yellow> <gray>- жуткий звук</gray>"
    m072: "<yellow>/luna evolution</yellow> <gray>- оповещение об эволюции луны</gray>"
    m073: "<gold>Предметы и настройки</gold>"
    m074: "<yellow>/luna give <игрок> <предмет> [кол-во]</yellow> <gray>- выдать предмет</gray>"
    m075: "<yellow>/luna items</yellow> <gray>- список предметов</gray>"
    m076: "<yellow>/luna chances <таблица></yellow> <gray>- шансы лута</gray>"
    m077: "<yellow>/luna reload</yellow> <gray>- перечитать конфиги</gray>"
    m078: "<yellow>Использование: /luna sound <звук|random> [all|мир|игрок] [громкость]</yellow>"
    m079: "<red>Неизвестный звук '{input}'. Нажмите Tab для списка.</red>"
    m080: "<red>Мир или игрок '{input}' не найден.</red>"
    m081: "<green>✔ Звук <white>{label}</white> проигран для <yellow>{target-name}</yellow> (игроков: {size}).</green>"
    m082: "<gray>Сейчас нет активной Кровавой Луны.</gray>"
    m083: "<gold>Статус длительности Кровавой Луны:</gold>"
    m084: "<gray>- Мир <white>{name}</white>: <yellow>{min}м {sec}с</yellow> (сложность: <yellow>x{difficulty}</yellow>)</gray>"
    m085: "<gold>Команды управления таймером Кровавой Луны:</gold>"
    m086: "<yellow>/luna time status</yellow> <gray>- просмотр оставшегося времени</gray>"
    m087: "<yellow>/luna time add <время> [мир]</yellow> <gray>- добавить время (пример: /luna time add 5m)</gray>"
    m088: "<yellow>/luna time take <время> [мир]</yellow> <gray>- сократить время (пример: /luna time take 2m)</gray>"
    m089: "<yellow>/luna time set <время> [мир]</yellow> <gray>- установить оставшееся время (пример: /luna time set 3m)</gray>"
