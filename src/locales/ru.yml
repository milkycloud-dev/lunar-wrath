# ==================== Особые события ====================
special:
  eclipse: "<dark_purple>✦ <bold>Затмение опускается на Кровавую Луну!</bold> <dark_purple>✦"
  storm: "<aqua>☂ Буря разразилась. Кровавая Луна питается хаосом."
  fog: "<gray>🌫 Густой туман окутывает выживших. <dark_gray>Вы ничего не видите."
