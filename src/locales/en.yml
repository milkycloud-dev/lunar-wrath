LocalesVersion: "2.0.0"
LanguageName: "English"

# ==================== General ====================
prefix: "<dark_red><bold>🌙 Blood Moon</bold> <dark_gray>» <reset>"
no-permission: "<red>You do not have permission to do that."
unknown-world: "<red>That world does not exist or is not loaded."
general-error: "<red>Something went wrong while handling your request."
plugin-reloaded: "<green>Configuration reloaded."
bed-not-allowed: "<red>You cannot sleep during the Blood Moon."
dying-results-inventory-loss: "<dark_red><bold>Dying during the Blood Moon wipes your inventory."
dying-results-xp-loss: "<dark_red><bold>Dying during the Blood Moon resets your experience."

# ==================== Event ====================
event:
  title: "<dark_red><bold>BLOOD MOON"
  subtitle: "<red>Survive until dawn <gray>(x{difficulty})"
  subtitle-clean: "<red>Survive until dawn..."
  start: "<red>The Blood Moon has risen! <gray>Difficulty <red>x{difficulty}<gray> · Duration <white>{minutes} min"
  start-clean: "<red><bold>🌙 The Blood Moon has risen!</bold> <gray>Survive until dawn..."
  end: "<green>The Blood Moon is over. Dawn breaks!"
  stopped: "<yellow>The Blood Moon was stopped."
  bar: "<dark_red>🌙 Blood Moon <gray>· <white>{time} <gray>· <red>x{difficulty}"
  summary-header: "<gold>Top hunters of the night:"
  summary-line: "<gray>{pos}. <white>{player} <dark_gray>- <red>{kills} kills"
  survivors: "<green>You survived the Blood Moon! Survivor reward received."
  horde-descending: "<dark_red><bold>⚡ A horde attacks <white>{player}<dark_red>! ⚡"
  horde-descending-personal: "<red><bold>⚡ A horde is coming for you! ⚡</bold></red>"
  player-died: "<dark_red>☠</dark_red> <white><bold>{player}</bold></white> <red>fell during the Blood Moon!</red> <dark_gray>(<gray>{cause}</gray>)</dark_gray>"
  player-died-actionbar: "<dark_red>☠ <white>{player}</white> died during the Blood Moon!</dark_red>"
  mob-slain: "<gray>× <white>{player} <gray>killed <red>{mob}<gray>."
  death-cause-unknown: "<gray>swallowed by the night"
  wither-blocked: "<red>The Wither is disabled on this server. Only the Blood Moon boss can appear."
  wither-only-bloodmoon: "<red>The Wither is forbidden in peacetime! You can only summon it during a Blood Moon."
  survivors-header: "<gold>Blood Moon survivors in {world}:"
  survivors-none: "<gray>No players qualify for the survivor reward in {world}."
  survivor-disqualified-death: "<red>You died and lost your survivor reward."
  survivor-insufficient-participation: "<yellow>You did not take part long enough for the survivor reward."
  already-active: "<red>A Blood Moon is already active in {world}."
  not-active: "<red>There is no active Blood Moon in {world}."
  cannot-stop-world: "<red>You cannot stop the Blood Moon in this world."
  world-permanent: "<red>The Blood Moon is permanent in this world."

# ==================== Schedule ====================
schedule:
  warning: "<yellow>The Blood Moon rises in <red>{min} min.<yellow> Get ready!"
  warning-params: "<yellow>The Blood Moon rises in <red>{min} min. <gray>(x{difficulty})<yellow>. Get ready!"
  warning-title: "<dark_red><bold>Moon rising!"
  warning-body: "<red>Experience is multiplied and mobs drop bonus loot.
<red>Mobs are stronger and apply special effects."

# ==================== Boss ====================
boss:
  spawn: "<dark_red>☠ The boss {boss}<dark_red> has appeared!"
  enraged: "<dark_red><bold>{boss} <dark_red><bold>IS ENRAGED! <red>It becomes faster and deadlier."
  killed: "<green>The boss {boss} <green>is defeated! Final blow: <white>{player}<green>."
  top-header: "<gold>Top damage to the boss:"
  top-line: "<gray>{pos}. <white>{player} <dark_gray>- <red>{damage} damage"
  top-reward: "<gold>You get a bonus reward for the damage you dealt to the boss."
  disabled: "<yellow>The Blood Moon boss is disabled in this world."
  spawn-failed: "<red>Could not summon the configured Blood Moon boss."
  mythic-not-found: "<red>MythicMobs mob '{name}' not found in {world}."
  mythic-unavailable: "<red>MythicMobs is unavailable or incompatible in {world}."
  mythic-fallback: "<gray>Falling back to the standard Blood Moon boss in {world}."

# ==================== Loot ====================
loot:
  broadcast: "<yellow><white>{player} <yellow>got {item} <dark_gray>[{rarity}<dark_gray>]<yellow>!"
  broadcast-epic: "<light_purple>✦</light_purple> <white>{player}</white> <gray>got an epic item:</gray> {item}"
  broadcast-legendary: "<gold>★ <bold>LEGENDARY DROP:</bold></gold> <white><bold>{player}</bold></white> <yellow>found the relic</yellow> {item}<yellow>!</yellow>"
  broadcast-mythic: "<gradient:#ff0055:#aa00ff><bold>⚡ MYTHIC ARTIFACT ⚡</bold></gradient> <white><bold>{player}</bold></white> <light_purple>awakened an ancient relic:</light_purple> {item}<light_purple>!</light_purple>"

# ==================== Items ====================
item:
  rarity-line: "<gray>Rarity: {rarity}"
  serial-line: "<dark_red>Copy <white>#{serial}<gray>/{limit}"

# ==================== Commands ====================
cmd:
  usage: "<yellow>Unknown command. See <white>/luna help</white>, Tab completes arguments."
  reloaded: "<green>Configuration reloaded."
  started: "<green>Blood Moon started in {world}."
  stopped: "<yellow>Blood Moon stopped in {world}."
  stopped-all: "<yellow>All moons stopped."
  status-none: "<gray>There is no active Blood Moon."
  status-line: "<red>● {world} <gray>· left <white>{time} <gray>· difficulty <red>x{difficulty}"
  next-line: "<gray>Next: <white>{when} <gray>(in {in}) · x{difficulty}"
  next-header: "<gold>Upcoming Blood Moons:"
  next-entry: "<dark_gray>- <white>{when} <gray>· in {in} · <red>x{difficulty}"
  next-none: "<gray>No schedule configured."
  usage-difficulty: "<yellow>Usage: /luna difficulty <x1-x1000> [world]"
  difficulty-set: "<green>Difficulty set to x{difficulty}. Applies to all new mobs."
  usage-boss: "<yellow>Usage: /luna boss <id> [world]. Bosses: {bosses}"
  boss-spawned: "<green>Boss {boss} summoned."
  boss-failed: "<red>Could not summon boss {boss} (check the id and that players are nearby)."
  horde-spawned: "<green>Horde spawned: {count} mobs."
  killed: "<green>Removed {count} Blood Moon mobs."
  usage-give: "<yellow>Usage: /luna give <player> <item> [amount]"
  player-unknown: "<red>Player {player} not found."
  item-unknown: "<red>Item {item} does not exist (see /luna items)."
  given: "<green>Gave {amount}x {item} to {player}."
  items-header: "<gold>Available items:"
  usage-chances: "<yellow>Usage: /luna chances <table>"
  table-unknown: "<red>Table {table} not found."
  survivors-header: "<gold>Survivor reward candidates in {world}:"
  survivors-line: "<gray>- <white>{player} <gray>(took part: {seconds} s)"
  survivors-none: "<gray>No survivor candidates in {world}."

# ==================== Placeholders ====================
placeholder:
  active: "Active"
  inactive: "Inactive"
  none: "None"
  eligible: "Eligible"
  disqualified: "Disqualified"
  not-participating: "Not participating"
  no-boss: "Not spawned yet"
  boss-state-none: "No active event"
  boss-state-not-spawned: "Not spawned yet"
  boss-state-alive: "Alive"
  boss-state-defeated: "Defeated"
  boss-display-not-spawned: "<gray>Boss: <dark_gray>Not spawned yet"
  boss-display-name: "<gray>Boss: <red>{name}"
  boss-display-defeated: "<gray>Boss: <green>{name}"
  boss-display-type: "<gray>Type: <white>{type}"
  boss-display-health: "<gray>Health: <red>{health}"

# ==================== Special events ====================
special:
  eclipse: "<dark_purple>✦ <bold>An eclipse falls over the Blood Moon!</bold> <dark_purple>✦"
  storm: "<aqua>☂ A storm breaks out. The Blood Moon feeds on chaos."
  fog: "<gray>🌫 Thick fog surrounds the survivors. <dark_gray>You can see nothing."
  silence: "<black>🔇 Dead silence swallows the world. <dark_gray>Only a heartbeat can be heard."

# ==================== Moons ====================
moon:
  name:
    blood: "Blood Moon"
    black: "Black Moon"
    purple: "Purple Moon"
  # Text replacements applied to warning messages for black and purple moons ("from=>to|from=>to")
  rename:
    black: "Blood Moon=>Black Moon|BLOOD MOON=>BLACK MOON"
    purple: "Blood Moon=>Purple Moon|BLOOD MOON=>PURPLE MOON"

# ==================== Time ====================
time:
  min: "{min} min"
  min-sec: "{min} min {sec} s"
  sec: "{sec} s"
  short-min-sec: "{min}m {sec}s"
  short-min: "{min}m"
  short-sec: "{sec}s"

# ==================== Mob names ====================
mob:
  paratrooper: "<gradient:#ff4444:#ffaa00>Piglin Paratrooper</gradient>"
  pyromancer: "<gradient:#ff7700:#ff2200>Piglin Pyromancer</gradient>"
  crossbowman: "<gradient:#ff5555:#ffff55>Infernal Crossbowman</gradient>"

