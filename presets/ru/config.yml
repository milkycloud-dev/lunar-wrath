# ------------------------------------------------------------
#  СКИНЫ
#  Скины игроков для мобов орды и боссов. Моб получает скин строкой
#  `skin: <id>` в horde.mobs или в bosses.yml. Скин виден как голова
#  игрока; armor красит кожаную броню под одежду скина (необязательно).
#  Применяется по /luna reload.
#    texture: хеш текстуры, ссылка textures.minecraft.net или base64 "textures"
#    player: ник, используется только при пустом texture (запрос к Mojang при загрузке)
#  У мобов орды есть ещё `id` (для SUMMON:<кд>:<кол-во>:<id> в bosses.yml)
#  и `scale` (размер модели, 1.0 = обычный).
# ------------------------------------------------------------
skins:
  eturnercus:
    texture: 994d7a108c53d4b1d5ceac62b21f0f4271680bea1bdcd96ba9d2d25d5c500048
    player: eturnercus
    armor: { chest: "#D8D8D8", legs: "#A0A0A0", feet: "#2A1A14" }

# ------------------------------------------------------------
#  LOOT
# ------------------------------------------------------------
loot:
  default-table: mob_horde
  survivor-table: survivors
  direct-to-inventory: false    # true: el loot va directo al inventario del que mata
  require-player-kill: true
  keep-vanilla-drops: false
  glow-rarities: [LEGENDARIO, MITICO]   # items que brillan e ignoran lava/explosiones al caer
