# ------------------------------------------------------------
#  ANUNCIOS DE CHAT
#  Por defecto SOLO se anuncian hordas, jefes y loot. Todo lo demás
#  (muertes de mobs, muertes de jugadores, inicio/fin del evento,
#  especiales, supervivientes y avisos) está apagado para que el chat
#  no se sature. Cambia a true lo que quieras volver a ver.
#  Efectivo con /luna reload
# ------------------------------------------------------------
announce:
  horde: false                # "Орда нападает на игрока" (false: личный Actionbar и рык атакуемому игроку без спама в чат)
  bosses: true                # появление боссов, их падение и топ урона
  loot: true                  # оповещение о выпадении эпических, легендарных и мифических наград
  mob-kills: false            # оповещение об убийстве обычных мобов (1 из 5)
  player-deaths: true         # оповещение о гибели игрока во время Кровавой Луны с раскатом грома
  event: true                 # начало, конец и итоги события
  specials: false             # eclipse, tormenta, niebla, silencio
  survivors: true            # resultados de supervivientes
  warnings: true             # avisos 10/5/1 min antes de que empiece

# ------------------------------------------------------------
#  ЭВОЛЮЦИЯ КРОВАВОЙ ЛУНЫ: НАКАЗАНИЕ ЗА ВЫХОД (QUIT PENALTY)
#  Игроки, которые выходят с сервера в течение опасного периода
#  после старта Кровавой Луны, погибают на месте выхода.
# ------------------------------------------------------------
quit-penalty:
  enabled: true
  # Длительность опасного периода в секундах после начала Кровавой Луны (60 = 1 минута).
  # Если указано 0 или -1, наказание действует на протяжении ВСЕЙ Кровавой Луны.
  duration-seconds: 60
  # Не наказывать игроков в творческом режиме (креатив) и зрителей (спектэйтор)
  exempt-creative: true
  # Право на обход наказания
  bypass-permission: "bloodmoon.bypass.quitpenalty"
  # Оповещения при старте Кровавой Луны
  announcement:
    # Сообщение в общий чат страшным шрифтом
    chat: "<gradient:#ff0000:#880000><bold>☠ Эволюция кровавой луны:</bold></gradient> <red><bold>при выходе с сервера после начала кровавой луны вы умрёте!</bold></red>"
    # Задержка перед показом титула на экране (в секундах, чтобы не перебивать заставку Луны)
    title-delay-seconds: 3
    # Заголовок на весь экран
    title: "<dark_red><bold>НЕ ВЫХОДИТЕ!</bold></dark_red>"
    # Подзаголовок на экран
    subtitle: "<red>Выход из игры сейчас = смерть</red>"
    # Тайминги анимации титула в тиках (20 тиков = 1 сек)
    title-times:
      fade-in: 10
      stay: 120
      fade-out: 20
    # Звук устрашения при старте
    sound: "entity.ender_dragon.growl"
    # Предупреждение в чат игроку при входе на сервер во время опасного периода
    join-warning: "<gradient:#ff0000:#770000><bold>☠ ВНИМАНИЕ:</bold></gradient> <red>Идёт Кровавая Луна! Выход с сервера в течение {remaining}с приведёт к немедленной смерти!</red>"
    # Экранный титул при входе
    join-title: "<dark_red><bold>ЛУНА АКТИВНА</bold></dark_red>"
    join-subtitle: "<red>Не выходите ещё {remaining} с</red>"
  # Действия при выходе из игры:
  on-quit:
    # Убивать игрока при выходе
    kill: true
    # Дропать инвентарь на землю (по правилам сервера)
    drop-items: true
    # Принудительно выбить все вещи на землю, даже если включен keepInventory
    force-drop-items: false
    # Удар молнии и частицы на месте выхода
    lightning: true
    # Оповещение в общий чат о смерти трусливого игрока
    broadcast: true
    death-message: "<gradient:#ff2222:#880000><bold>☠ Игрок <yellow>{player}</yellow> струсил и попытался сбежать от Кровавой Луны, но был настигнут смертью!</gradient>"
    # Сообщение игроку при следующем заходе на сервер
    reconnect-message: "<dark_red><bold>☠ Вы были казнены за попытку побега от Кровавой Луны!</bold></dark_red>"

# ------------------------------------------------------------
#  МОЛНИИ АДМИНИСТРАТОРА (/luna lightning)
# ------------------------------------------------------------
lightning:
  # Максимальная частота шторма в ударах в секунду для /luna lightning storm и frequency (0 = без ограничения).
  # Очень большие значения создают много молний и могут нагружать сервер.
  max-strikes-per-second: 0

# ------------------------------------------------------------
#  DIFICULTAD / СЛОЖНОСТЬ
#  Множитель N (x1 базовый, x100, x1000...). Каждая характеристика:
#      значение = базовая * (1 + (N - 1) * factor)
#  Все параметры полностью настраиваются без пересборки плагина.
# ------------------------------------------------------------
difficulty:
  default: 1.0
  max: 1000.0             # максимальная настраиваемая сложность (до x1000)
  speed-cap: 1.35         # жесткий лимит скорости мобов (не выше +35%, защищает от глитчей сквозь стены)
  max-health-cap: 2048.0  # максимальное здоровье мобов (2048 HP в соответствии с лимитами ядра Paper)
  max-horde-size-multiplier: 1.5 # лимит размера волны орды (защищает от лагов и переполнения сущностей)
  level:
    enabled: true         # отображение уровня мобов на основе сложности
    format: "<gray>[<gradient:#ff5555:#ffaa00>Ур. {level}</gradient>] {name}" # формат титула моба
    always-visible: false # true = видеть имя сквозь блоки, false = ванильное наведение
    store-pdc: true       # сохранять уровень в PDC (Keys.LEVEL и levelledmobs:level)
  bosses:
    scale-count-max: 1    # строго 1 босс за спавн (масштабируются только характеристики и награды)
    # Потолок урона одного удара босса по игроку: ближний бой, снаряды, взрывы,
    # дыхание дракона, способности и призванные боссом мобы. Считается по урону после брони, поэтому ни один
    # босс не убьёт игрока с полного здоровья одним ударом. В bosses.yml можно задать свой max-hit.
    max-hit: 14.0         # жёсткий потолок в единицах здоровья за удар (2.0 = одно сердце), 0 = выкл
    max-hit-fraction: 0.75 # потолок как доля макс. здоровья игрока, 0 = выкл; действует меньший из двух
  scaling:
    health: 0.35         # здоровье мобов (+35% за уровень сложности)
    damage: 0.35         # урон мобов (+35% за уровень сложности)
    speed: 0.05          # прирост скорости (ограничен speed-cap)
    horde-size: 0.15     # прирост размера орды (до x5)
    horde-size-max-difficulty: 5.0 # кап масштабирования размера орды (выше x5 не растет)
    spawn-speed: 0.15    # прирост частоты волн орды (до x5)
    spawn-speed-max-difficulty: 5.0 # кап частоты волн орды (не ускоряется выше x5)
    loot-chance: 0.35    # шанс выпадения лута
    loot-chance-max-difficulty: 5.0 # выше x5 шанс лута не растёт
    rarity-luck: 0.45    # удача для редких категорий лута
    rarity-luck-max-difficulty: 5.0 # выше x5 удача не растёт (сложность теперь без потолка)
    boss-damage: 0.1     # урон боссов (+10% за уровень сложности), отдельно от урона мобов
    boss-damage-max-difficulty: 10.0 # выше x10 урон боссов не растёт
  epic-effects:
    enabled: true
    min-difficulty: 3.0   # активация эпичных эффектов на сложностях от x3
    prevent-mob-infighting: true # предотвращает драки между мобами орды (friendly fire), фокусируя их на игроках
    rain-min-difficulty: 100.0 # сильный дождь и гроза включаются только со сложности x100
    red-sky:
      enabled: true
      red-vignette: true
    lightning:
      enabled: true
      base-strikes-per-sec: 0.46 # частота на минимальной сложности (x3) (~1.3x увеличение)
      max-strikes-per-sec: 45.5  # частота на экстремальной сложности (x1000) (~1.3x увеличение)
      min-radius: 8.0            # минимальное расстояние от игрока
      max-radius: 28.0           # максимальный радиус зоны молний
    particles:
      ambient-blood-spores: true
    fireworks:
      enabled: true
      interval-seconds: 12
      launch-at-player-chance: 0.20
    mob-abilities:
      skeleton-levitation:
        enabled: true
        chance: 0.20
        duration-ticks: 40 # 2 секунды левитации
        amplifier: 0
      zombie-lightning:
        enabled: true
        chance: 0.15
        bonus-damage: 2.5
      spider-slowness:
        enabled: true
        chance: 0.20
        duration-ticks: 60
      creeper-fireworks:
        enabled: true
        rocket-count: 3
  incendium:
    enabled: true
    chance-in-horde: 0.20 # шанс, что моб орды будет десантником, пиромантом или арбалетчиком
    min-difficulty: 1.0   # с какой сложности эти пиглины появляются в орде
    weights:              # относительные шансы трёх типов пиглинов, 0 = никогда
      paratrooper: 3.0    # брутальный пиглин-десантник на элитрах
      crossbowman: 1.0
      pyromancer: 1.0
    pyromancer:
      min-difficulty: 6.0 # Пиромант появляется только со сложности x6 и выше
      temp-fire: true     # автоматическое тушение огня и очистка при завершении луны

