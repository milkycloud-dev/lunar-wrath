# ============================================================
#  BloodMoonPlus - configuración principal
# ============================================================

# Mundos donde ocurre el evento (si un horario no define los suyos).
worlds:
  - world

# ------------------------------------------------------------
#  PROGRAMACIÓN DEL EVENTO - 2 MODOS
# ------------------------------------------------------------
#
#  MODO 1: "weekly" (por defecto)
#  Por día de la semana a hora fija en zona horaria (hora México).
#  Cada día puede tener una o varias horas. Un día sin entrada NO tiene evento.
#  Ejemplo: cada LUNES a las 14:00 hora México:
#
#    schedule:
#      mode: weekly
#      days:
#        MONDAY:
#          - "14:00"
#
#  MODO 2: "interval"
#  Cada N horas reales (ej. cada 72h = cada 3 días reales).
#  El temporizador corre aunque el servidor esté apagado.
#  Ejemplo: cada 72 horas:
#
#    schedule:
#      mode: interval
#      interval-hours: 72
#
#  Las horas SIEMPRE entre comillas: "21:30"  (formato 24 h).
#  En modo weekly, cada hora puede ser texto simple o un bloque con opciones:
#        - time: "20:40"
#          difficulty: 3          # x3 (triple)
#          duration-minutes: 15
#          worlds: [world]        # opcional
# ------------------------------------------------------------
schedule:
  enabled: true
  mode: weekly                   # weekly | interval
  timezone: "Europe/Moscow"
  interval-hours: 72            # solo para modo interval
  grace-seconds: 180            # si el servidor estaba apagado a la hora exacta, aún se dispara dentro de este margen
  skip-if-no-players: true      # no inicia el evento si el mundo está vacío
  warnings-minutes: [10]        # оповещения перед запланированным стартом (только за 10 мин)
  days:
    MONDAY:
      - time: "14:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    TUESDAY:
      - time: "14:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    WEDNESDAY:
      - time: "14:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    THURSDAY:
      - time: "14:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    FRIDAY:
      - time: "14:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    SATURDAY:
      - time: "14:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    SUNDAY:
      - time: "14:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15

# ------------------------------------------------------------
#  EVENTO
# ------------------------------------------------------------
event:
  duration-minutes: 15
  global: true                 # true: el evento arranca en TODOS los mundos cargados al mismo tiempo
                               #       (hordas, jefes, barra, noche y participantes en cada mundo).
                               # false: solo en los mundos de la lista "worlds" de abajo.
  lock-night: true              # fija la noche durante el evento
  night-time-ticks: 18000
  end-time-ticks: 23000         # hora del mundo al terminar (amanecer cercano)
  clear-weather: true
  first-wave-delay-seconds: 3   # segundos exactos del arranque a la primera horda
  remove-mobs-on-end: true
  force-difficulty: true           # sube la dificultad del mundo a EASY si está en Pacífico (necesario para spawnear mobs); se restaura al terminar
  protect-terrain: true            # las explosiones de mobs (creepers, etc.) NO rompen bloques; el jefe de la Luna SÍ los rompe (como el Wither vanilla)
  block-wither-spawn: false        # bloquea el spawn de CUALQUIER Wither excepto el jefe de la Luna (tag bloodmoon_boss); desactívalo si quieres Withers normales
  ignore-ops: true                 # Игнорировать игроков с OP (мобы не агрятся, орда не спавнится на админов, разрешен GM 3)
  reward-on-stop: false         # dar recompensa a supervivientes si se detiene con /luna stop
  commands-on-start: []         # consola; {world}
  commands-on-end: []
  survivor-commands: []         # consola, por superviviente; {player}  ej: "eco give {player} 500"
  start-announcement:
    # Заголовок титула при старте
    title: "<dark_red><bold>КРОВАВАЯ ЛУНА</bold></dark_red>"
    # Подзаголовок без параметров (когда warning.show-parameters: false)
    subtitle: "<red>Выживите до рассвета...</red>"
    # Подзаголовок с параметрами (когда warning.show-parameters: true)
    subtitle-with-params: "<red>Выживите до рассвета <gray>(x{difficulty})</gray></red>"
    # Сообщение в чат без параметров
    chat: "<red><bold>🌙 Кровавая Луна началась!</bold> <gray>Выживите до рассвета...</gray>"
    # Сообщение в чат с параметрами
    chat-with-params: "<red><bold>🌙 Кровавая Луна началась!</bold> <gray>Сложность <red>x{difficulty}</red> · Длительность <white>{minutes} мин</white></gray>"

# Управление Иссушителем: запрещен в мирное время, разрешен во время Кровавой Луны
wither-control:
  enabled: true
  # Разрешать призыв и спавн Иссушителя ТОЛЬКО во время активной Кровавой Луны
  allow-only-during-bloodmoon: true
  # Автоматически снимать/возвращать флаг deny-spawn в WorldGuard для региона __global__
  sync-worldguard: true
  # Миры, для которых действует ограничение
  worlds:
    - world
  # Другие мобы из deny-spawn региона __global__, которые должны оставаться запрещены всегда (кроме Иссушителя)
  keep-deny-spawn: []

# ------------------------------------------------------------
#  УСТАНОВКА БЛОКОВ ВО ВРЕМЯ КРОВАВОЙ ЛУНЫ (BLOCK PLACEMENT)
# ------------------------------------------------------------
block-placement:
  # Разрешить ли игрокам ставить блоки во время Кровавой Луны
  # true = игроки могут свободно строить и ставить блоки
  # false = установка блоков запрещена (запрещает застраиваться и столбиться от мобов)
  allow: true
  # Разрешать ли ставить блоки игрокам в творческом режиме (креатив) и спектаторам
  exempt-creative: true
  # Право для обхода запрета строительства
  bypass-permission: "bloodmoon.bypass.blockplace"
  # Сообщение при попытке поставить блок (если allow: false)
  deny-message: "<red>☠ Темная магия Кровавой Луны сковывает землю: строительство запрещено!</red>"

# ------------------------------------------------------------
#  ПРЕДУПРЕЖДЕНИЯ И ОБРАТНЫЙ ОТСЧЕТ (WARNINGS & COUNTDOWN)
# ------------------------------------------------------------
warning:
  # Отображать ли параметры Кровавой Луны (сложность и длительность) в предупреждениях.
  # По умолчанию: false (параметры скрыты, чтобы игроки не знали точную сложность заранее).
  show-parameters: false
  # Устрашающий звук при предупреждении (entity.wither.ambient, entity.ender_dragon.growl, ambient.cave и т.д.)
  sound: "entity.wither.ambient"
  sound-volume: 1.0
  sound-pitch: 0.6

countdown:
  # Отправлять ли промежуточные периодические оповещения во время отсчета
  # Если false (по умолчанию): отправляется СТРОГО ОДНО уведомление в момент запуска команды,
  # и больше никаких уведомлений до самого восхода луны не спамит в чат.
  periodic-alerts: false
  # Отображать ли параметры в обратном отсчете (по умолчанию false)
  show-parameters: false
  # Устрашающий звук при оповещениях обратного отсчета
  sound: "entity.ender_dragon.growl"
  sound-volume: 1.0
  sound-pitch: 0.6
  # Секунды, на которых выводятся предупреждения в чат и на экран
  alert-seconds: [300, 180, 120, 60, 30, 15, 10, 5, 4, 3, 2, 1]
  # Звук отсчета на последних 5 секундах (5, 4, 3, 2, 1)
  tick-sound: "block.note_block.basedrum"
  # Сообщение в чат (без параметров)
  chat: "<dark_red><bold>☠ ВНИМАНИЕ:</bold></dark_red> <red>Кровавая Луна начнется через <yellow>{time}</yellow>! Приготовьтесь к кошмару!</red>"
  # Сообщение в чат (с параметрами, если show-parameters: true)
  chat-with-params: "<dark_red><bold>☠ ВНИМАНИЕ:</bold></dark_red> <red>Кровавая Луна начнется через <yellow>{time}</yellow>! <gray>(Сложность <red>x{difficulty}</red> · Длительность <white>{duration} мин</white>)</gray></red>"
  # Заголовок на экране
  title: "<dark_red><bold>КРОВАВАЯ ЛУНА</bold></dark_red>"
  subtitle: "<red>Начало через {time}...</red>"
  subtitle-with-params: "<red>Начало через {time} <gray>(x{difficulty})</gray></red>"

# ------------------------------------------------------------
#  БЛОКИРОВКА РЕЖИМА НАБЛЮДАТЕЛЯ (GM 3 / SPECTATOR BLOCK)
# ------------------------------------------------------------
spectator-block:
  # Запретить ли переход в режим наблюдателя (gm 3) во время Кровавой Луны и обратного отсчета
  enabled: true
  # Принудительно возвращать игроков из GM 3 в режим выживания при старте Луны или обратного отсчета
  kick-existing: true
  # Право на обход блокировки (игроки с OP всегда имеют право на обход и свободный переход в GM 3)
  bypass-permission: ""
  # Сообщение при попытке переключиться в GM 3
  deny-message: "<red><bold>☠ Темные силы Кровавой Луны запрещают режим наблюдателя (GM 3)! Сражайтесь или погибните!</bold></red>"
  # Сообщение при принудительном переводе из GM 3 в выживание
  kick-message: "<red><bold>☠ Кровавая Луна началась: режим наблюдателя отключен, вы возвращены в режим выживания!</bold></red>"

# ------------------------------------------------------------
#  ГНЕВ ИЗМЕРЕНИЙ (DIMENSION WRATH / АНТИ-ОТСИЖИВАНИЕ В АДУ И ЭНДЕ)
# ------------------------------------------------------------
dimension-wrath:
  # Включить ли кару игроков, пытающихся отсидеться в других измерениях во время Кровавой Луны
  enabled: true
  # Применять ли кару в Незере (Аду)
  apply-to-nether: true
  # Применять ли кару в Крае (Энде)
  apply-to-end: true
  # Интервал ударов прицельной молнией (в секундах)
  strike-interval-seconds: 2
  # Урон за один удар (4.0 = 2 полных сердца, увеличено в 4 раза по сравнению со старым 1.0)
  damage: 4.0
  # Транслировать ли предупреждения в общий чат (false = только личное сообщение нарушителю)
  broadcast-chat: true
  # Интервал сообщений в общий чат (в секундах)
  broadcast-interval-seconds: 30
  # Освобождать ли игроков в креативе и спектаторе
  exempt-creative: true
  # Право для обхода кары измерений
  bypass-permission: "bloodmoon.bypass.dimensionwrath"
  # Сообщения для Незера
  nether:
    broadcast-message: "<gradient:#ff4500:#990000><bold>⚡ ГНЕВ НЕЗЕРА:</bold></gradient> <red>В преисподней нет спасения от Кровавой Луны! Игрок <yellow>{player}</yellow> поражен адской молнией за попытку отсидеться в аду!</red>"
    actionbar-message: "<gradient:#ff5500:#aa0000><bold>⚡ Разряд Незера поражает вас за бегство в ад! (-{hearts} ❤)</bold></gradient>"
    death-message: "<gradient:#ff4500:#990000><bold>☠ Игрок <yellow>{player}</yellow> пытался спастись в аду от Кровавой Луны, но был испепелен адской молнией!</gradient>"
  # Сообщения для Энда
  end:
    broadcast-message: "<gradient:#b000ff:#440077><bold>⚡ ГНЕВ ЭНДА:</bold></gradient> <red>В пустоте Края нет спасения от Кровавой Луны! Игрок <yellow>{player}</yellow> поражен астральной молнией за попытку отсидеться в Энде!</red>"
    actionbar-message: "<gradient:#c033ff:#660099><bold>⚡ Пустотный разряд Энда поражает вас за бегство в Край! (-{hearts} ❤)</bold></gradient>"
    death-message: "<gradient:#b000ff:#440077><bold>☠ Игрок <yellow>{player}</yellow> пытался укрыться в Энде от Кровавой Луны, но был поглощен астральной молнией!</gradient>"

# ------------------------------------------------------------
#  ГНЕВ НЕБЕС (ELYTRA WRATH / АНТИ-ПОЛЕТ НА ЭЛИТРАХ В НЕБЕСАХ)
# ------------------------------------------------------------
elytra-wrath:
  # Включить ли сбивание и кару игроков, парящих на элитрах высоко в небе
  enabled: true
  # Минимальная высота Y, начиная с которой полет считается уклонением
  min-altitude: 90.0
  # Сколько секунд непрерывного полета разрешено до первого удара молнии
  flight-time-seconds: 3
  # Интервал повторных ударов молнией (в секундах)
  strike-interval-seconds: 2
  # Урон первого удара молнии (4.0 = 2 полных сердца)
  damage: 4.0
  # Множитель урона за каждый следующий удар подряд (1.5 = +50%: 4, 6, 9, 13.5, 20 ...)
  damage-multiplier: 1.5
  # Потолок урона одного удара
  max-damage: 40.0
  # Через сколько секунд без ударов счетчик усиления сбрасывается (приземление его не сбрасывает)
  streak-reset-seconds: 60
  # С какого урона следующего удара игрок получает предупреждение в чат (0 = не предупреждать)
  warn-damage: 8.0
  # Предупреждение в чат, {hearts} = урон следующего удара в сердцах
  warn-message: "<dark_red><bold>⚠ Небо отвергает вас!</bold></dark_red> <red>Каждый новый удар молнии сильнее прежнего: следующий отнимет <yellow>{hearts} ❤</yellow>. Немедленно приземлитесь!</red>"
  # Складывать ли крылья элитр (принудительно прерывать планирование)
  disrupt-flight: true
  # Транслировать ли предупреждения в общий чат (false = только личное сообщение нарушителю)
  broadcast-chat: true
  # Интервал сообщений в общий чат (в секундах)
  broadcast-interval-seconds: 30
  # Освобождать ли игроков в креативе и спектаторе
  exempt-creative: true
  # Право для обхода кары элитр
  bypass-permission: "bloodmoon.bypass.elytrawrath"
  # Сообщение в общий чат
  broadcast-message: "<gradient:#00e5ff:#0055ff><bold>⚡ ГНЕВ НЕБЕС:</bold></gradient> <red>В небесах нет спасения от Кровавой Луны! Игрок <yellow>{player}</yellow> поражен небесной молнией за попытку летать на элитрах!</red>"
  # Сообщение в экшн-бар
  actionbar-message: "<gradient:#00e5ff:#0088ff><bold>⚡ Небесный разряд Кровавой Луны сбивает вас с небес! (-{hearts} ❤)</bold></gradient>"
  # Сообщение о смерти игрока от небесной молнии
  death-message: "<gradient:#00e5ff:#0055ff><bold>☠ Игрок <yellow>{player}</yellow> пытался скрыться от Кровавой Луны в небесах на элитрах, но был испепелен молнией!</gradient>"

# ------------------------------------------------------------
#  СВОДКА СМЕРТЕЙ (DEATH SUMMARY / АНТИСПАМ ПОВТОРНЫХ СМЕРТЕЙ)
# ------------------------------------------------------------
death-summary:
  # Первая смерть игрока объявляется как обычно, следующие в пределах окна не пишутся в чат, а собираются в одну сводку
  enabled: true
  # Длина окна в секундах, сводка выходит не чаще одного раза за окно
  window-seconds: 60
  # Сводка в общий чат, {player}, {count} = сколько смертей скрыто, {seconds} = длина окна
  message: "<dark_red>☠</dark_red> <white><bold>{player}</bold></white> <red>погиб ещё <yellow>{count}</yellow> раз за последнюю минуту.</red>"

# ------------------------------------------------------------
#  ГНЕВ ХРАНИЛИЩ (CONTAINER WRATH / ЗАПРЕТ СУНДУКОВ ВО ВРЕМЯ ЛУНЫ)
# ------------------------------------------------------------
container-wrath:
  # Запрещать ли открывать хранилища в мире с активной луной
  enabled: true
  # Какие блоки запечатаны (если удалить список, берутся сундуки, бочки, эндер-сундуки и все шалкеры)
  blocks:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - ENDER_CHEST
    - SHULKER_BOX
    - WHITE_SHULKER_BOX
    - ORANGE_SHULKER_BOX
    - MAGENTA_SHULKER_BOX
    - LIGHT_BLUE_SHULKER_BOX
    - YELLOW_SHULKER_BOX
    - LIME_SHULKER_BOX
    - PINK_SHULKER_BOX
    - GRAY_SHULKER_BOX
    - LIGHT_GRAY_SHULKER_BOX
    - CYAN_SHULKER_BOX
    - PURPLE_SHULKER_BOX
    - BLUE_SHULKER_BOX
    - BROWN_SHULKER_BOX
    - GREEN_SHULKER_BOX
    - RED_SHULKER_BOX
    - BLACK_SHULKER_BOX
  # Запрещать ли вагонетки с сундуком и воронкой
  block-minecarts: true
  # Сколько попыток заканчиваются только предупреждением, прежде чем появится босс
  warnings-before-punish: 1
  # Не чаще одного босса на игрока за это число секунд
  punish-cooldown-seconds: 180
  # Призывать ли босса после предупреждений
  boss-enabled: true
  # Босс из bosses.yml, который вырывается из хранилища
  boss: "wither_sombra"
  # Взрыв печати при попытке, когда босс не появляется: блоки не ломает, бьёт только открывшего
  explosion:
    enabled: true
    # Урон игроку (6.0 = 3 сердца, броня снижает)
    damage: 6.0
  # Освобождать ли игроков в креативе и спектаторе
  exempt-creative: true
  # Право для обхода запрета
  bypass-permission: "bloodmoon.bypass.containerwrath"
  # Личное предупреждение при попытке открыть хранилище
  warn-message: "<dark_red><bold>⚠ Не открывайте сундуки во время Кровавой Луны!</bold></dark_red> <red>Хранилища запечатаны, печать взрывается при касании. Следующая попытка пробудит то, что спит внутри.</red>"
  # Сообщение, когда из хранилища появляется босс
  punish-message: "<dark_red><bold>☠ Вы потревожили запечатанное хранилище!</bold></dark_red> <red>Из него вырывается страж Кровавой Луны.</red>"

# ------------------------------------------------------------
#  ДИНАМИЧЕСКАЯ СЛОЖНОСТЬ (DYNAMIC DIFFICULTY / АНТИ-ОТСИЖИВАНИЕ БЕЗ БОЯ)
# ------------------------------------------------------------
dynamic-difficulty:
  # Включить ли автоматическое увеличение сложности при отсиживании игроков
  enabled: true
  # Время бездействия в бою (в секундах), после которого игрок считается отсиживающимся
  inactivity-seconds: 45
  # Радиус проверки стояния на месте (в блоках, кемпинг в убежище)
  camping-radius: 4.0
  # Интервал эскалации сложности (в секундах)
  escalation-interval-seconds: 25
  # Шаг увеличения сложности за каждое бездействие
  difficulty-step: 0.25
  # Максимальная сложность, до которой может вырасти Луна (0 = без ограничения)
  max-difficulty: 0
  # Спавнить ли карательную орду монстров вокруг прячущегося игрока
  spawn-punishment-horde: true
  # Количество мобов в карательной орде
  punishment-horde-count: 5
  # Снижать ли сложность при активных убийствах монстров игроками
  decay-on-combat: true
  # Количество убийств монстров, необходимое для снижения сложности на 1 шаг
  kills-for-decay: 10
  # Шаг снижения сложности при активном бое
  decay-step: 0.1
  # Освобождать ли игроков в креативе и спектаторе
  exempt-creative: true
  # Транслировать ли рост сложности в общий чат с ником виновника (false = сообщение только самому игроку)
  broadcast-chat: true
  bypass-permission: "bloodmoon.bypass.dynamicdifficulty"
  announcement:
    escalate: "<gradient:#ff2200:#ff8800><bold>⚡ ЯРОСТЬ КРОВАВОЙ ЛУНЫ:</bold></gradient> <red>Игрок <yellow>{player}</yellow> отсиживается вместо боя, и Луна распаляется! Сложность возросла до <yellow>x{difficulty}</yellow>!</red>"
    camper-warning: "<gradient:#ff0000:#aa0000><bold>☠ Кровавая Луна чует ваш страх! Вы прячетесь от боя! Сражайтесь или навлечёте беду!</bold></gradient>"
    # {players} = до трёх игроков с наибольшим числом убийств с прошлого снижения, {player} = сделавший последнее убийство
    decay: "<gradient:#00ff88:#00aa55><bold>✔ ВОЛЯ ВЫЖИВШИХ:</bold></gradient> <green><yellow>{players}</yellow> истребляют порождения луны, и её ярость стихает! Сложность снизилась до <yellow>x{difficulty}</yellow>.</green>"

