# Поля босса: name, type, health, damage (множитель урона в ближнем бою и снарядами),
# ability-damage (множитель урона способностей, по умолчанию 1.0), speed, scale,
# knockback-resistance, bar-color, bar-overlay, equipment, abilities, enrage-at,
# enrage-cooldown, enrage-damage, loot-table, top-damage-table, exp,
# max-hit (потолок урона одного удара по игроку после брони, заменяет
# difficulty.bosses.max-hit из config.yml, 0 = действует только max-hit-fraction),
# max-damage (потолок сырого урона до брони, заменяет difficulty.bosses.max-damage),
# bar-radius (дальность полосы босса в блоках, заменяет difficulty.bosses.bar-radius),
# skin (id из раздела skins в config.yml).
# Урон боссов растёт со сложностью по difficulty.scaling.boss-damage.
# SUMMON:<кд>:<кол-во>:<ТИП_СУЩНОСТИ или id моба орды>
# spawns: каждая строка это отдельный бросок за луну (boss, delay-seconds, chance, min-difficulty, count);
# несколько строк одного босса дают ему несколько шансов за луну.
